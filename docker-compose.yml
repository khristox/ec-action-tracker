# ~/ec-action-tracker/docker-compose.yml
services:
  postgres:
    image: postgres:16
    container_name: ec_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "ec_user"
      POSTGRES_PASSWORD: "ec_password"
      POSTGRES_DB: "ec_action_tracker"
        # command: 
      # - --default-authentication-plugin=mysql_native_password
        # - --character-set-server=utf8mb4
        # - --collation-server=utf8mb4_unicode_ci
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ec_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ec_user -d ec_action_tracker"]
      timeout: 5s
      retries: 10
      interval: 10s

  redis:
    image: redis:7-alpine
    container_name: ec_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ec_network

  minio:
    image: minio/minio
    container_name: ec_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - ec_network

  app:
    image: wagambula/ec-action-tracker:2026-10-26
    build: .
    container_name: ec_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8001:8001"
    # Mapping all variables from the .env file automatically
    env_file:
      - .env.local
    environment:
      # We construct the URL dynamically using variables from .env
      IN_DOCKER: "True"
      DATABASE_URL: "postgresql+asyncpg://ec_user:ec_password@ec_postgres:5432/ec_action_tracker"  # Changed from @localhost
      REDIS_URL: "redis://ec_redis:6379/0"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_SECURE: "False"
      BACKEND_URL: "http://localhost:8006"
      API_BASE_URL: "http://localhost:8006"
      FRONTEND_DIST_PATH: "/app/frontend/dist"
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:8001","http://localhost:8006"]'
    volumes:
      - ./logs:/app/logs
      - ./static:/app/static
    networks:
      - ec_network

volumes:
  postgres_data:
  minio_data:

networks:
  ec_network:
    driver: bridge
