# ~/ec-action-tracker/docker/docker-compose.yml
services:
  postgres:
    image: postgres:16
    container_name: ec_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DATABASE: "ec_action_tracker"
      POSTGRES_USER: "ec_user"
      POSTGRES_PASSWORD: "ec_password"
    
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ec_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ec_user -d ec_action_tracker"]
      timeout: 5s
      retries: 30
      interval: 5s
      start_period: 10s

  app:
    build:
      context: /home/wagambula/ec-action-tracker/
      dockerfile: Dockerfile
    container_name: ec_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8006:8001"
    volumes:
      - ./logs:/app/logs
      - /app/static
    networks:
      - ec_network
    environment:
      DATABASE_URL: "postgresql+asyncpg://ec_user:ec_password@localhost:5432/ec_action_tracker"
      SECRET_KEY: "anq7XxRv9Zado5dWbZSNmD2LOboeSKF1OpAN4g4TgTQ"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      REFRESH_TOKEN_SECRET_KEY: "XwgWnxCp9YpVJAYLrYICX7ia_mhcOm1RgStM63hHUKU"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "Admin123!"
      IN_DOCKER: "true"
      BACKEND_URL: "http://127.0.0.1:8006"
      API_BASE_URL: "http://127.0.0.1:8006"
      ENVIRONMENT: "production"
      DEBUG: "false"
      LOG_LEVEL: "INFO"
      FRONTEND_DIST_PATH: "/app/static"	
      FRONTEND_URL: "http://196.0.124.179:8001/api/v1/auth"


volumes:
  postgres_data:

networks:
  ec_network:
    driver: bridge
