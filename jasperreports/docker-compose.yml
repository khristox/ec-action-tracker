services:
  jasperserver:
    build:
      context: ./custom
      dockerfile: Dockerfile
    container_name: jasperserver
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=jasperadmin
      - DB_PASSWORD=jasperpass
      - DB_NAME=jasperserver
      - JAVA_OPTS=-Xmx1024m -XX:MaxPermSize=256m
    depends_on:
      - postgres
    volumes:
      - jasperserver_data:/usr/local/tomcat/webapps/ROOT/WEB-INF/data
      - ./custom/jasperserver-config:/usr/local/tomcat/webapps/ROOT/WEB-INF/classes
    restart: unless-stopped
    networks:
      - jasper-network

  postgres:
    image: postgres:13
    container_name: jasper_postgres
    environment:
      - POSTGRES_USER=jasperadmin
      - POSTGRES_PASSWORD=jasperpass
      - POSTGRES_DB=jasperserver
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - jasper-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jasperadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Add adminer for database management
  adminer:
    image: adminer:latest
    container_name: jasper_adminer
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - jasper-network

volumes:
  jasperserver_data:
  postgres_data:

networks:
  jasper-network:
    driver: bridge
